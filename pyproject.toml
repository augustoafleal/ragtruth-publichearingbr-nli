[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtruth-publichearing-transfer"
version = "0.1.0"
description = "Treinamento em RAGTruth e avaliação zero-shot no PublicHearingBR-NLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=4.27,<5.0",
  "peft>=0.12",
  "accelerate>=0.33",
  "huggingface-hub>=0.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.9",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires frozen scientific artifacts that are not versioned in the repository",
]
