protocol:
  name: publichearing_set_transformer_paired_grouped_bootstrap
  analysis_type: paired_grouped_bootstrap
  group_key: hearing_id
  paired: true
inputs:
  campaigns:
    gated_attention:
      path: ../runs/ragtruth_confirmatory/4e12933c51136624
      expected_signature: 4e12933c51136624
      score_column: probability
    set_transformer:
      path: ../runs/ragtruth_confirmatory/28323e6cca11feb6
      expected_signature: 28323e6cca11feb6
      score_column: probability
  seeds: [0, 1, 2]
comparisons:
  - left: set_transformer
    right: gated_attention
bootstrap:
  n_replicates: 10000
  seed: 20260815
  confidence_level: 0.95
  ci_method: percentile
  preserve_group_multiplicity: true
  same_samples_across_methods: true
  same_samples_across_seeds: true
metrics: [auprc, auroc, brier]
output:
  root: ../runs/publichearing_set_transformer_paired_bootstrap
