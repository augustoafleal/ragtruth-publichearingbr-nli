translation:
  translator: nllb
  model_name: facebook/nllb-200-distilled-600M
  source_language: eng_Latn
  target_language: por_Latn
  batch_size: 2
  num_beams: 4
  max_input_tokens: 480
  max_new_tokens: 512
  device: auto

data:
  input_dir: ../data/processed/ragtruth_textual
  output_dir: ../data/processed/ragtruth_textual_pt_nllb_smoke
  splits:
    - train
    - validation
    - test
  max_examples_per_split: 3
