protocol:
  name: publichearing_ragtruth_vs_off_the_shelf_paired_bootstrap
  analysis_type: paired_grouped_bootstrap
  group_key: hearing_id
  paired: true
inputs:
  baseline_run:
    path: ../runs/publichearing_off_the_shelf_max_entailment/54d9c623f8685c39
    score_column: hallucination_score
    expected_signature: 54d9c623f8685c39
  ragtruth_confirmatory_run:
    path: ../runs/ragtruth_confirmatory/4e12933c51136624
    seeds: [0, 1, 2]
    score_column: probability
    expected_signature: 4e12933c51136624
bootstrap:
  n_replicates: 10000
  seed: 20260806
  confidence_level: 0.95
  ci_method: percentile
  preserve_group_multiplicity: true
  same_samples_across_methods: true
  same_samples_across_seeds: true
metrics: [auprc, auroc, brier_improvement]
output:
  root: ../runs/publichearing_paired_grouped_bootstrap
