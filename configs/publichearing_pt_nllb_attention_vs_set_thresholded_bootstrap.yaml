    path: ../runs/ragtruth_pt_nllb_set_transformer_confirmatory/29ec472694bb61a8
    expected_signature: 29ec472694bb61a8
    config_path: ragtruth_pt_nllb_lora_set_transformer_confirmatory.yaml
    expected_pooling: set_transformer
