  seeds: [0, 1, 2]
threshold_regimes: [best_f1, fpr10]
population:
  examples: 4235
  positives: 501
  hearings: 206
  publichearing_dataset_signature: 13408024c4776eff24f05ee6a56f9b1d33614524d19e90c0cce2fa310487a34e
